# Declared input: what the catalog's publisher states, because the schema or the statute asks for it and the model's
# package cannot know it. Override by editing a copy of this file (--catalog FILE) or with --contact-name and
# --contact-email. The writer refuses an empty contact e-mail rather than inventing one.
contact:
  name: Axius SDC, Inc. DCAT contact
  email: contact@axius-sdc.com
catalog:
  title: Semantic Data Charter governed data records
  description: Collections of Governed Data Records, one per published Semantic Data Charter model, each described by the immutable schema its records conform to.
  homepage: https://semanticdatacharter.com
publisher:
  name: Axius SDC, Inc.
  id: https://axius-sdc.com
# What the publisher asserts about access. An agency replaces these with its M-25-05 determinations (accessRights,
# rights statements, restrictions); nothing here is defaulted for an agency.
access_rights: public
rights: []
theme: []
